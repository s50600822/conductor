# Set root logger level to DEBUG and its only appender to A1.
log4j.rootLogger=DEBUG, A1

# A1 is set to be a ConsoleAppender.
log4j.appender.A1=org.apache.log4j.ConsoleAppender

log4j.logger.root=WARN
log4j.logger.org.apache.zookeeper=WARN
log4j.logger.org.apache.curator=WARN
log4j.logger.com.netflix.conductor.core.execution.WorkflowExecutor=WARN
log4j.logger.com.netflix.conductor.service.ExecutionLockService=WARN
log4j.logger.org.eclipse.jetty.util.thread=DEBUG
log4j.logger.org.eclipse.jetty.util.log=DEBUG
log4j.logger.org.slf4j.impl.Log4jLoggerAdapter=DEBUG
log4j.logger.com.netflix.dyno.queues.redis.RedisDynoQueue=WARN
log4j.logger.SystemTaskWorkerCoordinator=WARN
log4j.logger.org.eclipse.jetty.util.log.Slf4jLog=DEBUG
log4j.logger.org.eclipse.jetty.util.thread.QueuedThreadPool=DEBUG
log4j.logger.org.eclipse.jetty.util.thread.ReservedThreadExecutor=DEBUG

# A1 uses PatternLayout.
log4j.appender.A1.layout=org.apache.log4j.PatternLayout
log4j.appender.A1.layout.ConversionPattern=%-4r [%t] %-5p %c %x - %m%n
